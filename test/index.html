<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="top-pill" href="https://ryumakojima.com/"><span class="plus">+</span> Skip</a>

  <!--
    Avatars: original SVGs in a "big round head, simple face parts" style.
    Not traced from Nintendo Mii assets.
    Layer order in each: body -> ears -> face -> hair -> face parts.
  -->
  <main class="stage">
    <header class="intro">
      <h1 id="question">Who's visiting today?</h1>
      <p>Pick one. The site rearranges itself for you.</p>
    </header>

    <div class="users" role="radiogroup" aria-labelledby="question">

      <div class="user-wrapper">
        <button class="user" role="radio" aria-checked="true" data-key="recruiter" data-name="Recruiter">
          <span class="user-face">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <!-- suit, collar, tie -->
              <path d="M12 100 C14 90 30 85 50 85 C70 85 86 90 88 100 Z" fill="#2f3b4c"/>
              <path d="M41 87 L50 100 L59 87 Z" fill="#fff"/>
              <path d="M48.5 90 L51.5 90 L53 100 L47 100 Z" fill="#c8413a"/>
              <!-- ears + face -->
              <circle cx="20" cy="58" r="6" fill="#f2c9a5"/>
              <circle cx="80" cy="58" r="6" fill="#f2c9a5"/>
              <path d="M20 50 C20 24 80 24 80 50 C80 74 66 89 50 89 C34 89 20 74 20 50 Z" fill="#f7d6b8"/>
              <!-- neat side-part hair -->
              <path d="M18 54 C13 20 40 9 55 11 C76 13 88 28 82 54 C80 44 77 36 71 31 C58 35 41 31 34 24 C28 32 22 42 18 54 Z" fill="#2b2522"/>
              <!-- brows, eyes, nose, mouth -->
              <path d="M34 47 L45 46" stroke="#2b2522" stroke-width="3" stroke-linecap="round"/>
              <path d="M55 46 L66 47" stroke="#2b2522" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="40" cy="56" rx="3.2" ry="4.4" fill="#222"/><circle cx="41" cy="54.5" r="1.1" fill="#fff"/>
              <ellipse cx="60" cy="56" rx="3.2" ry="4.4" fill="#222"/><circle cx="61" cy="54.5" r="1.1" fill="#fff"/>
              <path d="M47 65 Q50 68 53 65" fill="none" stroke="#c99576" stroke-width="2" stroke-linecap="round"/>
              <path d="M43 73 Q50 77 57 73" fill="none" stroke="#7a3b2e" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="badge">R</span>
          <span class="bubble">That's me</span>
        </button>
        <span class="user-label">Recruiter</span>
      </div>

      <div class="user-wrapper">
        <button class="user" role="radio" aria-checked="false" data-key="developer" data-name="Developer">
          <span class="user-face">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <!-- hoodie + strings -->
              <path d="M12 100 C14 90 30 85 50 85 C70 85 86 90 88 100 Z" fill="#3d7fc1"/>
              <path d="M44 89 L44 98 M56 89 L56 98" stroke="#e8eef4" stroke-width="2" stroke-linecap="round"/>
              <!-- ears + face -->
              <circle cx="20" cy="58" r="6" fill="#f2c9a5"/>
              <circle cx="80" cy="58" r="6" fill="#f2c9a5"/>
              <path d="M20 50 C20 24 80 24 80 50 C80 74 66 89 50 89 C34 89 20 74 20 50 Z" fill="#f7d6b8"/>
              <!-- messy hair -->
              <path d="M17 55 C12 17 46 5 60 10 C78 10 90 30 83 55 C81 45 78 39 74 35 L68 41 L64 33 L57 39 L50 31 L43 39 L36 32 L29 41 C24 45 20 50 17 55 Z" fill="#6b4630"/>
              <!-- brows -->
              <path d="M34 46 L45 45" stroke="#6b4630" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M55 45 L66 46" stroke="#6b4630" stroke-width="2.6" stroke-linecap="round"/>
              <!-- eyes behind round glasses -->
              <ellipse cx="40" cy="56" rx="2.8" ry="3.8" fill="#222"/><circle cx="41" cy="54.8" r="1" fill="#fff"/>
              <ellipse cx="60" cy="56" rx="2.8" ry="3.8" fill="#222"/><circle cx="61" cy="54.8" r="1" fill="#fff"/>
              <circle cx="40" cy="56" r="8" fill="none" stroke="#33363a" stroke-width="2.2"/>
              <circle cx="60" cy="56" r="8" fill="none" stroke="#33363a" stroke-width="2.2"/>
              <path d="M48 55 Q50 53.5 52 55" fill="none" stroke="#33363a" stroke-width="2.2"/>
              <!-- nose, mouth -->
              <path d="M47 66 Q50 69 53 66" fill="none" stroke="#c99576" stroke-width="2" stroke-linecap="round"/>
              <path d="M45 74 Q50 76 55 74" fill="none" stroke="#7a3b2e" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="badge">D</span>
          <span class="bubble">That's me</span>
        </button>
        <span class="user-label">Developer</span>
      </div>

      <div class="user-wrapper">
        <button class="user" role="radio" aria-checked="false" data-key="hacker" data-name="Hacker">
          <span class="user-face">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <!-- hood (behind head) -->
              <path d="M8 100 C6 60 12 12 50 10 C88 12 94 60 92 100 Z" fill="#2b2d31"/>
              <!-- face -->
              <path d="M20 50 C20 24 80 24 80 50 C80 74 66 89 50 89 C34 89 20 74 20 50 Z" fill="#f7d6b8"/>
              <!-- hood rim over forehead -->
              <path d="M19 52 C17 20 83 20 81 52 C76 38 64 32 50 32 C36 32 24 38 19 52 Z" fill="#2b2d31"/>
              <path d="M19 52 C24 38 36 32 50 32 C64 32 76 38 81 52" fill="none" stroke="#45484e" stroke-width="2"/>
              <!-- dark glasses -->
              <rect x="30" y="51" width="17" height="10" rx="3.5" fill="#15171a"/>
              <rect x="53" y="51" width="17" height="10" rx="3.5" fill="#15171a"/>
              <path d="M47 55 L53 55" stroke="#15171a" stroke-width="2.4"/>
              <path d="M33 53.5 L39 53.5" stroke="#5b6068" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M56 53.5 L62 53.5" stroke="#5b6068" stroke-width="1.6" stroke-linecap="round"/>
              <!-- nose, flat mouth -->
              <path d="M47 67 Q50 70 53 67" fill="none" stroke="#c99576" stroke-width="2" stroke-linecap="round"/>
              <path d="M45 75 L55 75" stroke="#7a3b2e" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="badge">H</span>
          <span class="bubble">That's me</span>
        </button>
        <span class="user-label">Hacker</span>
      </div>

      <div class="user-wrapper">
        <button class="user" role="radio" aria-checked="false" data-key="co-worker" data-name="Co-worker">
          <span class="user-face">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <!-- red shirt -->
              <path d="M12 100 C14 90 30 85 50 85 C70 85 86 90 88 100 Z" fill="#d9483b"/>
              <!-- ears + face -->
              <circle cx="20" cy="58" r="6" fill="#f2c9a5"/>
              <circle cx="80" cy="58" r="6" fill="#f2c9a5"/>
              <path d="M20 50 C20 24 80 24 80 50 C80 74 66 89 50 89 C34 89 20 74 20 50 Z" fill="#f7d6b8"/>
              <!-- short hair, straight fringe -->
              <path d="M18 53 C13 15 87 15 82 53 C81 45 79 40 77 37 C60 40 40 40 23 37 C21 40 19 45 18 53 Z" fill="#4a3324"/>
              <!-- soft brows, smiling eyes -->
              <path d="M34 47 Q39.5 44.5 45 46.5" fill="none" stroke="#4a3324" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M55 46.5 Q60.5 44.5 66 47" fill="none" stroke="#4a3324" stroke-width="2.6" stroke-linecap="round"/>
              <ellipse cx="40" cy="56" rx="3.2" ry="4.4" fill="#222"/><circle cx="41" cy="54.5" r="1.1" fill="#fff"/>
              <ellipse cx="60" cy="56" rx="3.2" ry="4.4" fill="#222"/><circle cx="61" cy="54.5" r="1.1" fill="#fff"/>
              <!-- cheeks -->
              <ellipse cx="30" cy="66" rx="4" ry="2.4" fill="#f2a99a" opacity=".55"/>
              <ellipse cx="70" cy="66" rx="4" ry="2.4" fill="#f2a99a" opacity=".55"/>
              <!-- nose, smile -->
              <path d="M47 65 Q50 68 53 65" fill="none" stroke="#c99576" stroke-width="2" stroke-linecap="round"/>
              <path d="M41 72 Q50 80 59 72" fill="none" stroke="#7a3b2e" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="badge">C</span>
          <span class="bubble">That's me</span>
        </button>
        <span class="user-label">Co-worker</span>
      </div>

    </div>
  </main>

  <section class="panel">
    <div class="panel-hero" id="hero" aria-hidden="true"></div>
    <div class="panel-info">
      <div class="field"><span class="label">You are a</span><span class="value" id="name">Recruiter</span></div>
    </div>
    <button class="go" id="go">Start as <span id="go-role">Recruiter</span></button>
  </section>

  <p id="result" class="result" hidden></p>

  <script>
    const users = [...document.querySelectorAll('.user')];
    const $ = id => document.getElementById(id);
    let index = 0;

    function select(i) {
      index = (i + users.length) % users.length;
      users.forEach((u, n) => u.setAttribute('aria-checked', n === index));
      const u = users[index];
      $('hero').replaceChildren(u.querySelector('svg').cloneNode(true));
      $('name').textContent = u.dataset.name;
      $('go-role').textContent = u.dataset.name;
    }

    users.forEach((u, n) => {
      u.addEventListener('mouseenter', () => select(n));
      u.addEventListener('focus', () => select(n));
      u.addEventListener('click', start);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') select(index + 1);
      if (e.key === 'ArrowLeft') select(index - 1);
    });
    $('go').addEventListener('click', start);

    function start() {
      const r = $('result');
      r.hidden = false;
      r.textContent = 'Started as: ' + users[index].dataset.key;
    }
    select(0);
  </script>
</body>
</html>
